<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24/7 Noticias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f4; --card:#ffffff; --ink:#0c1b2e; --mute:#566275; --line:#cfd6df;
  --hero:#0c1b2e; --hero-ink:#ffffff; --hero-mute:#a9b7c9; --cobalt:#1c4ed8; --amber:#ffb800;
  --head:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#08111c;--card:#0f1b2b;--ink:#e9eef5;--mute:#93a1b4;--line:#22324a;--hero:#13263f;--cobalt:#6c93ff}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px 56px}

/* Cabecera */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 0 18px}
.brand{margin:0;font-family:var(--head);font-stretch:62%;font-weight:900;font-size:clamp(52px,10vw,88px);line-height:.85;letter-spacing:-.02em}
.brand small{display:block;font-stretch:100%;font-weight:600;font-size:clamp(15px,2.4vw,20px);letter-spacing:0;margin-top:6px;color:var(--mute)}
.estado{font:600 14px/1.4 var(--head);color:var(--mute);text-align:right}
.estado b{display:block;color:var(--ink);font-size:16px}
.punto{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e5322d;margin-right:7px;animation:latir 2s ease-in-out infinite}
@keyframes latir{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.punto{animation:none}}

/* Filtro de temas */
nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0;border-top:3px solid var(--ink)}
nav button{font:700 15px/1 var(--head);border:2px solid var(--ink);background:transparent;color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Portada */
.portada{display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-top:6px}
@media(max-width:860px){.portada{grid-template-columns:1fr}}
.principal{background:var(--hero);color:var(--hero-ink);border-radius:6px;padding:clamp(22px,4vw,40px);display:flex;flex-direction:column;justify-content:flex-end;min-height:360px;border-left:10px solid var(--amber)}
.principal h2{font-family:var(--head);font-stretch:75%;font-weight:800;font-size:clamp(32px,5.6vw,60px);line-height:1.02;margin:10px 0 14px;letter-spacing:-.01em}
.principal p{margin:0;font-size:18px;color:var(--hero-mute);max-width:60ch}
.principal a:hover h2{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:3px}
.meta{font:600 13px/1.4 var(--head);color:var(--mute)}
.principal .meta{color:var(--hero-mute)}
.meta b{color:var(--cobalt);font-weight:800}
.principal .meta b{color:var(--amber)}

.ultima{background:var(--card);border-radius:6px;padding:8px 20px 12px}
.ultima h3,.col h3{font:800 24px/1 var(--head);font-stretch:75%;margin:16px 0 4px}
.fila{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.fila:first-of-type{border-top:0}
.hora{font:700 14px/1.3 var(--head);font-variant-numeric:tabular-nums;color:var(--mute);padding-top:3px}
.fila h4{font:700 18px/1.2 var(--head);margin:0}
.fila a:hover h4{text-decoration:underline}
.fila .meta{margin-top:5px}

/* Columnas Chile / Mundo */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.col{background:var(--card);border-radius:6px;padding:8px 22px 14px}
.col h3{font-size:34px;padding-bottom:10px;border-bottom:3px solid var(--ink);margin-bottom:0}
.nota{padding:16px 0;border-bottom:1px solid var(--line)}
.nota:last-child{border-bottom:0}
.nota h4{font:700 20px/1.18 var(--head);margin:4px 0 6px}
.nota a:hover h4{text-decoration:underline}
.nota p{margin:0;font-size:16px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vacio{color:var(--mute);font:600 15px var(--head);padding:18px 0}
footer{margin-top:36px;padding-top:16px;border-top:3px solid var(--ink);font:500 13px/1.5 var(--head);color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">24/7<small>Noticias de Chile y del mundo</small></h1>
    <div class="estado"><b id="fecha"></b><span class="punto"></span><span id="act">Cargando…</span></div>
  </header>
  <nav id="nav" aria-label="Temas"></nav>
  <main>
    <section class="portada" id="portada" aria-live="polite"></section>
    <section class="cols">
      <div class="col"><h3>En Chile</h3><div id="chile"></div></div>
      <div class="col"><h3>En el mundo</h3><div id="mundo"></div></div>
    </section>
  </main>
  <footer>Política, economía y actualidad, sin farándula. Mostramos titular, un extracto y el enlace a cada medio; la nota completa está en la fuente original. Se actualiza sola cada 30 minutos.</footer>
</div>
<script>
const TEMAS = ["Todo","Política","Economía","Sociedad"];
let datos = [], tema = "Todo", actualizado = null;
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };

function hora(f){
  const d = new Date(f), hoy = new Date();
  const h = d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  if(d.toDateString() === hoy.toDateString()) return h;
  if(d.toDateString() === new Date(hoy - 864e5).toDateString()) return "ayer " + h;
  return d.toLocaleDateString("es-CL",{day:"numeric",month:"short"});
}
function enlace(n){ const a = el("a"); a.href = n.url; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; }
function meta(n){ const m = el("div","meta"); const b = el("b",null,n.tema); m.append(b, " – " + n.fuente + (n.cobertura ? ", en " + (n.cobertura + 1) + " medios" : "")); return m; }

function principal(n){
  const box = el("article","principal"), a = enlace(n);
  a.append(meta(n), el("h2",null,n.titulo));
  if(n.resumen) a.append(el("p",null,n.resumen));
  box.append(a); return box;
}
function ultima(lista){
  const box = el("aside","ultima"); box.append(el("h3",null,"Última hora"));
  lista.forEach(n => {
    const f = el("div","fila"), a = enlace(n);
    a.append(el("h4",null,n.titulo), meta(n));
    f.append(el("div","hora",hora(n.fecha)), a); box.append(f);
  });
  return box;
}
function nota(n){
  const d = el("article","nota"), a = enlace(n);
  a.append(meta(n), el("h4",null,n.titulo));
  if(n.resumen) a.append(el("p",null,n.resumen));
  d.append(a); return d;
}
function pintar(){
  const l = datos.filter(n => tema === "Todo" || n.tema === tema);
  const lead = l[0];
  const resto = l.slice(1);
  const ult = [...resto].sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).slice(0,5);
  const usados = new Set([lead, ...ult]);
  $("portada").replaceChildren();
  if(lead){ $("portada").append(principal(lead), ultima(ult)); }
  else { $("portada").append(el("p","vacio", datos.length ? "No hay notas de este tema por ahora." : "Cargando las noticias del día…")); }
  [["Chile","chile"],["Mundo","mundo"]].forEach(([amb,id]) => {
    const c = $(id); c.replaceChildren();
    const notas = l.filter(n => n.ambito === amb && !usados.has(n));
    if(!notas.length) c.append(el("p","vacio","Sin más notas de este tema por ahora."));
    notas.slice(0,8).forEach(n => c.append(nota(n)));
  });
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-pressed", String(b.textContent === tema)));
}
TEMAS.forEach(t => { const b = el("button",null,t); b.onclick = () => { tema = t; pintar(); }; $("nav").append(b); });

function reloj(){
  $("fecha").textContent = new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  if(actualizado){
    const min = Math.round((Date.now() - new Date(actualizado)) / 60000);
    $("act").textContent = min < 1 ? "Actualizado ahora" : "Actualizado hace " + min + " min";
  }
}
async function cargar(){
  try{
    const j = await (await fetch("/api/noticias")).json();
    datos = j.notas; actualizado = j.actualizado;
    if(!datos.length) $("act").textContent = "Esperando las primeras noticias…";
    pintar(); reloj();
  }catch(e){ $("act").textContent = "No se pudo conectar con el servidor"; }
}
cargar(); setInterval(cargar, 5 * 60 * 1000); setInterval(reloj, 30000);
</script>
</body>
</html>
